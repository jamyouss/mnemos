# Build the images from this checkout:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Set MNEMOS_*_IMAGE in .env to local tags (mnemos-server:dev, …) so a build
# never shadows the published images.
services:
  rag-server:
    build:
      context: .
      dockerfile: server/Dockerfile

  watcher:
    build:
      context: .
      dockerfile: watcher/Dockerfile

  ingester:
    build:
      context: .
      dockerfile: cli/Dockerfile
