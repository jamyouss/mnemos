# Knowledge connectors — what `mnemos ingest run` / `mnemos ingest serve` keep
# in sync inside `mnemos_knowledge` (documents) and `mnemos_code` (git
# repositories, by default).
#
# Import template: copy to config/connectors.yaml (gitignored) and adapt
# BEFORE the first server start. The server imports it once, when the database
# holds no connectors, then ignores it; afterwards edit the sources from the
# dashboard's Connectors page. `mnemos ingest run|serve --config FILE` still
# reads a file like this one directly. See docs/CONNECTORS.md.
#
# Secrets never go in this file: a source that needs a token names the
# environment variable that holds it (`token_env`). A variable that is not set
# stops the run before anything is synced.

# How often `mnemos ingest serve` resyncs after the start-up sync: 45s, 30m,
# 6h, 1d… Omit it to sync only at start-up, on file change and on SIGHUP.
interval: 6h

sources:
  # Every source: `type` (confluence | jira | web | git), optional `name` (defaults
  # to the type; must be unique — it is what `mnemos ingest run --only <name>`
  # selects) and optional `tags` added to every document.

  - type: confluence
    name: wiki
    url: https://wiki.example.com          # Cloud: https://<site>.atlassian.net
    token_env: CONFLUENCE_TOKEN            # Data Center PAT, or Cloud API token
    # user: bot@example.com                # Cloud only: account email (HTTP Basic)
    # deployment: auto                     # auto | cloud | datacenter
    spaces: [ENG, OPS]
    tags: [acme]

  - type: jira
    name: tracker
    url: https://jira.example.com
    token_env: JIRA_TOKEN
    projects: [OPS]
    # jql: resolution = Unresolved OR updated >= -180d   # ANDed to `project = KEY`

  - type: web
    name: handbook
    urls: [https://docs.example.com/handbook/]   # crawl stays on the host, under this path
    max_pages: 200

  - type: git
    name: app
    url: https://github.com/acme/app.git   # HTTPS, any host (GitHub, GitLab…)
    # token_env: GITHUB_TOKEN              # private repository: read-only token
    # branch: main                         # default: the remote's default branch
    # paths: [docs/, services/api]         # default: the whole repository
    # exclude: ["*.lock", "*/testdata/*"]
    # max_file_kb: 512                     # larger (and binary) files are skipped
    # collection: mnemos_code              # or mnemos_knowledge
