# API keys for MNEMOS_AUTH_ENABLED=true. Copy to config/tenants.yaml (gitignored).
#
# A tenant is an identity only: one name, one api_key. Every tenant reads and
# writes the same collections — there is no per-tenant isolation or quota.
# Clients send the key as `Authorization: Bearer <api_key>`.
#
# The file is read once at startup: restart rag-server to apply changes.
# The server refuses to start with an empty or CHANGE_ME key, or one key
# shared by two tenants. Never commit real keys.

tenants:
  team_a:
    api_key: "CHANGE_ME"
