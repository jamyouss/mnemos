[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemos-connectors"
version = "0.1.0"
description = "Pull Confluence, Jira and web content into a Mnemos server."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27.0",
    "markdownify>=0.13.0",
    "pyyaml>=6.0",
]

[tool.setuptools]
packages = ["connectors"]
package-dir = {"connectors" = "."}
