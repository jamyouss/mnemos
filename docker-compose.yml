# Every setting comes from .env: cp .env.example .env
services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - qdrant_data:/qdrant/storage
    # Loopback only: host tools reach it, the LAN does not.
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 5

  rag-server:
    image: ${MNEMOS_SERVER_IMAGE}
    restart: unless-stopped
    pull_policy: ${MNEMOS_PULL_POLICY}
    env_file: .env
    ports:
      - "8100:8100"
    volumes:
      - ${MNEMOS_CODEBASE_HOST_PATH}:/data/codebase:ro
      - ${MNEMOS_CLAUDE_CONFIG_HOST_PATH}:/data/claude-config:ro
      # One-time import sources and theme.css; the server writes nothing here.
      - ./config:/app/config:ro
      # Mounted as a file so it can be a symlink: Docker resolves a bind-mount
      # source on the host, a symlink inside a mounted directory would dangle.
      - ./config/projects.yaml:/app/config/projects.yaml:ro
      - ./evals/runs:/app/evals/runs:ro
      - rag_state:/data/state
      # Models fetched at runtime (reranker, a non-default EMBEDDING_MODEL).
      - hf_cache:/opt/hf_cache
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  watcher:
    image: ${MNEMOS_WATCHER_IMAGE}
    restart: unless-stopped
    pull_policy: ${MNEMOS_PULL_POLICY}
    env_file: .env
    volumes:
      - ${MNEMOS_CODEBASE_HOST_PATH}:/data/codebase:ro
      - ${MNEMOS_CLAUDE_CONFIG_HOST_PATH}:/data/claude-config:ro
    depends_on:
      rag-server:
        condition: service_healthy

  # Knowledge connectors. Opt-in: docker compose --profile connectors up -d
  # Resync now: docker compose kill -s HUP ingester. Never scale it.
  ingester:
    image: ${MNEMOS_CLI_IMAGE}
    restart: unless-stopped
    pull_policy: ${MNEMOS_PULL_POLICY}
    command: ["ingest", "serve"]
    env_file: .env
    depends_on:
      rag-server:
        condition: service_healthy
    profiles:
      - connectors

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    profiles:
      - llm

volumes:
  qdrant_data:
  rag_state:
  ollama_data:
  hf_cache:
