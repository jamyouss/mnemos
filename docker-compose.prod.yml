# Deployed instance: set MNEMOS_AUTH_ENABLED=true, QDRANT_API_KEY and
# QDRANT__SERVICE__API_KEY (same value) in .env.
services:
  rag-server:
    volumes:
      # First tenants, imported once when the database holds none. Using
      # MNEMOS_BOOTSTRAP_ADMIN_KEY instead? Drop this mount.
      - ./config/tenants.yaml:/data/config/tenants.yaml:ro

  watcher:
    profiles:
      - disabled
